# Pin Studio settings for MoneySavvyUK. Edit freely; no code changes needed.
brand:
  name: MoneySavvyUK
  site: moneysavvyuk.com
  colours:
    cream: "#FBF6EE"
    teal: "#0E4D5C"
    deep: "#0A3540"
    coral: "#E36F4F"
    gold: "#F2B544"
    ink: "#1D2B30"
    muted: "#51636A"
    green: "#2E8B57"
    red: "#D64545"
    white: "#FFFFFF"
    line: "#E4DCCF"
    circle: "#135F70"
  cta: "Read the full guide"
  product_cta: "Get the printable"

# Your own MoneySavvyUK boards, copied exactly from Pinterest (case and punctuation matter:
# a misspelt name makes Pinterest CREATE a new board). Add or remove names freely.
boards:
  - Money Saving Tips|
  - Make Money Online |
  - Debt free Life
  - Financial freedom
  - How to make a budget
  - Free budget printables
  - Save money on groceries
  - budget meal planning
  - Declutter ideas
  - Work from home jobs for moms
  - Investing money for beginners
  - Save money for house deposit
  - Save money for baby
  - Money Savvy UK
  - www.moneysavvyuk.com
# Group boards you belong to (not used automatically; check each board's rules before adding to the list above):
#   A+ Financial Motivation · Personal Finance Hub · Budget Tips · Saving Money · Make Money From Home
#   Money Management Tips · Personal Financial Freedom · Frugal money saving budgeting tips

pins_per_post: 15

schedule:
  timezone: Europe/London
  pins_per_day: 15          # 10-25; you can also change this in the app sidebar
  day_start: "08:00"
  day_end: "21:00"
  max_per_link_per_day: 3
  horizon_days: 14          # Pinterest only accepts publish dates about 14 days ahead
  min_gap_hours_same_post: 2   # pins for the same post on the same day are at least this far apart

wordpress:
  base_url: https://moneysavvyuk.com
  # Images you upload in a given month land in /wp-content/uploads/YYYY/MM/
  uploads_path: /wp-content/uploads

pinterest_csv:
  # Column names for Pinterest's bulk upload. If Pinterest's downloaded template differs, change them here.
  columns: ["Title", "Media URL", "Pinterest board", "Thumbnail", "Description", "Link", "Publish date", "Keywords"]
  date_format: "%Y-%m-%dT%H:%M:%S"   # written in UTC
  max_rows: 100              # Pinterest allows up to 200 per upload; smaller files are easier to fix

seo:
  title_max: 100
  keyword_within_first: 40
  description_min: 100
  description_max: 300
  alt_max: 500
  allow_hashtags: false
  near_duplicate: 0.85       # titles this similar (0-1) to any earlier title are blocked

llm:
  mode: openai                # openai | mock (mock = offline, no key, simpler copy)
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  temperature: 0.7
  timeout_s: 60
  # USD per million tokens, for the cost estimate shown in the app. Check OpenAI's current prices.
  price_in: 0.15
  price_out: 0.60
